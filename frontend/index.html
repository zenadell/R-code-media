<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Strategist Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-blue: #3b82f6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Layout --- */
        .sidebar {
            width: 320px;
            padding: 2rem;
            background: rgba(15, 23, 42, 0.85);
            /* Slightly darker for contrast */
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            z-index: 10;
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.3);
        }

        .main-content {
            flex: 1;
            padding: 3rem;
            /* More breathing room */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: relative;
            align-items: center;
            /* Center content width-wise */
        }

        .intelligence-hub {
            width: 320px;
            padding: 2rem;
            background: rgba(15, 23, 42, 0.7);
            border-left: 1px solid var(--glass-border);
            overflow-y: auto;
            display: flex;
            /* Enable flex for centering placeholder */
            flex-direction: column;
        }

        /* --- Typography --- */
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #a0a0b0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            /* Center Logo */
        }

        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .logo span {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            text-align: center;
            /* Center Section Headers */
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.5rem;
        }

        /* --- Controls --- */
        .control-group {
            margin-bottom: 0.8rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
            color: var(--text-secondary);
            font-weight: 600;
            padding-left: 4px;
        }

        input,
        select {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 12px 16px;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.05);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        /* Button */
        .btn-generate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            margin-top: auto;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            /* For icon if needed */
        }

        /* Moving shine effect */
        .btn-generate::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.2), transparent);
            transition: 0.6s;
        }

        .btn-generate:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
            color: #bfdbfe;
            /* Lighter blue text */
        }

        .btn-generate:hover::after {
            left: 100%;
        }

        .btn-generate:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: wait;
            transform: none;
            box-shadow: none;
        }

        .btn-chat {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #bdc3c7;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-chat:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border-color: var(--accent-blue);
            transform: translateY(-1px);
        }

        .sidebar-footer {
            margin-top: 1.5rem;
            text-align: center;
            padding-top: 1rem;
            border-top: 1px solid var(--glass-border);
        }

        .sidebar-footer a {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-decoration: none;
            opacity: 0.5;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar-footer a:hover {
            opacity: 1;
            color: var(--accent-blue);
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        /* --- Live Writer Area --- */
        #output {
            width: 100%;
            max-width: 900px;
            /* Constrain width for readability like a document */
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 4rem;
            font-size: 1.1rem;
            line-height: 1.8;
            white-space: pre-wrap;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);

            /* Center the placeholder text initially */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            /* Default to top */
        }

        #output.initial-state {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* --- Chat & Rework UI --- */
        #chat-interface {
            width: 100%;
            max-width: 900px;
            margin-top: 1rem;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.3);
            position: sticky;
            bottom: 0;
            z-index: 100;
        }

        #chat-messages {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .chat-msg {
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
        }

        .chat-user {
            align-self: flex-end;
            background: var(--accent-blue);
            color: white;
        }

        .chat-ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border: 1px solid var(--glass-border);
        }

        .chat-input-area {
            display: flex;
            gap: 0.5rem;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 8px;
        }

        .chat-input-area button {
            padding: 0 1.5rem;
            background: var(--accent-blue);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Rework Tooltip */
        .glass-tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-blue);
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            display: none;
            /* Hidden by default */
            z-index: 200;
            backdrop-filter: blur(10px);
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-tooltip button {
            background: none;
            border: none;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .glass-tooltip button:hover {
            color: var(--accent-blue);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .highlight-rework {
            background: rgba(59, 130, 246, 0.2);
            border-bottom: 2px solid var(--accent-blue);
            animation: pulseHighlight 2s infinite;
        }

        /* History Items */
        .history-item {
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--glass-border);
        }

        .history-title {
            font-weight: 600;
            color: white;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-meta {
            color: var(--text-secondary);
            font-size: 0.7rem;
        }


        /* Platform Themes */
        .platform-linkedin {
            border-top: 4px solid #0077b5;
        }

        .platform-twitter {
            border-top: 4px solid #1da1f2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .platform-instagram {
            border-top: 4px solid #e1306c;
        }

        /* --- Source Cards --- */
        .source-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .source-card:hover {
            transform: translateX(-5px);
            background: rgba(255, 255, 255, 0.1);
        }

        .source-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #fff;
            display: block;
            text-decoration: none;
        }

        .source-domain {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* --- Virality Badge --- */
        #virality-badge {
            position: absolute;
            bottom: 3rem;
            right: 4rem;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--glass-border);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            display: none;
            /* Flex when active */
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(10px);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }

        #virality-badge span {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        #virality-badge strong {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
            margin-top: 0.25rem;
        }

        .high-score strong {
            color: #22c55e;
            text-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }

        .med-score strong {
            color: #eab308;
        }

        .low-score strong {
            color: #ef4444;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* --- MOBILE RESPONSIVENESS (Verified) --- */
        @media (max-width: 900px) {
            body {
                flex-direction: column !important;
                overflow-y: auto !important;
                height: auto !important;
            }

            .sidebar {
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid var(--glass-border);
                padding: 1.5rem;
                gap: 1rem;
                position: relative !important;
                height: auto !important;
                flex: none !important;
            }

            .main-content {
                padding: 1.5rem !important;
                min-height: 600px;
                display: block !important;
                flex: none !important;
                overflow: visible !important;
            }

            #output {
                padding: 1.5rem;
                border-radius: 12px;
                min-height: 400px;
                margin-bottom: 2rem;
            }

            .intelligence-hub {
                width: 100% !important;
                border-left: none !important;
                border-top: 1px solid var(--glass-border);
                padding: 1.5rem !important;
                height: auto !important;
                max-height: none !important;
                background: rgba(15, 23, 42, 1) !important;
                flex: none !important;
            }

            #virality-badge {
                position: fixed;
                bottom: 1rem;
                right: 1rem;
                transform: scale(0.8);
                z-index: 100;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar: Controls -->
    <div class="sidebar">
        <div class="logo">
            <span>R-Code Media</span>
        </div>

        <div class="control-group">
            <label>Target Audience / Company</label>
            <input type="text" id="company" placeholder="e.g. Acme Corp, Tech Startups...">
        </div>

        <div class="control-group">
            <label>Campaign Focus</label>
            <input type="text" id="focus" placeholder="e.g. Product Launch, Brand Awareness...">
        </div>

        <div class="control-group">
            <label>Platform DNA</label>
            <select id="platform">
                <option value="LinkedIn">LinkedIn (Professional)</option>
                <option value="Twitter">X / Twitter (Viral)</option>
                <option value="Instagram">Instagram (Visual)</option>
                <option value="Blog">SEO Blog (Long-form)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Duration (Days)</label>
            <input type="number" id="days" value="7" min="1" max="30">
        </div>

        <div class="control-group">
            <label>Model Engine</label>
            <select id="model">
                <option value="gemini-2.5-flash">Chaka v0.1 (Fast)</option>
                <option value="gemini-2.5-pro">Chaka v0.2 (Pro)</option>
                <option value="gemini-2.0-flash">Chaka v0.1 (Legacy)</option>
            </select>
        </div>

        <button class="btn-generate" onclick="generateStrategy()">
            Initialize Strategy
            <div class="btn-glow"></div>
        </button>

        <!-- History Log -->
        <div id="history-section"
            style="margin-top: 1rem; border-top: 1px solid var(--glass-border); padding-top: 1rem; flex: 1; overflow: hidden; display: flex; flex-direction: column;">
            <h3>Recent Strategies 🕒</h3>
            <div id="history-list"
                style="overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 0.5rem; padding-right: 5px;">
                <!-- History items will be injected here -->
                <div style="font-size: 0.75rem; color: var(--text-secondary); text-align: center; font-style: italic;">
                    No history yet.</div>
            </div>
        </div>

        <div class="sidebar-footer">
            <button onclick="exportDatabase()"
                style="background: none; border: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.7rem; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-bottom: 10px; width: 100%; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s;">
                💾 Export Data (SQL)
            </button>
            <div style="font-size: 0.65rem; color: var(--text-secondary); margin-top: 5px;">
                Powered by <a href="https://chaka-ai-v2.netlify.app" target="_blank"
                    style="color: var(--accent-blue);">Chaka Intelligence</a><br>
                Developed by Jomiez | Lead: Templeton
            </div>
        </div>
    </div>

    <!-- Main: Live Writer -->
    <div class="main-content">
        <div id="output" class="platform-linkedin initial-state">
            <span style="color: var(--text-secondary); font-style: italic; font-size: 1.2rem;">
                ✨ Ready to generate.<br>Configure your strategy on the left and initialize the engine.
            </span>
        </div>
        <div id="virality-badge"></div>

        <!-- Rework Tooltip (Hidden) -->
        <div id="rework-tooltip" class="glass-tooltip">
            <button onclick="activateRework()">✨ AI Rework Selection</button>
        </div>

        <!-- Chat Interface -->
        <div id="chat-interface">
            <div id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Ask Chaka or select text to rework..."
                    onkeypress="handleChatKey(event)">
                <button onclick="sendChat()">➤</button>
            </div>
        </div>
    </div>

    <!-- Right: Intelligence Hub -->
    <div class="intelligence-hub">
        <h3>Intelligence Hub 🧠 (Dual-Core)</h3>
        <div id="sources-container" style="flex: 1; display: flex; align-items: center; justify-content: center;">
            <div style="color: var(--text-secondary); font-size: 0.9rem; font-style: italic; text-align: center;">
                Active research sources<br>will appear here...
            </div>
        </div>
    </div>

    <script>
        // --- History Management ---
        const HISTORY_KEY = 'rcode_history_v1';
        let currentStrategyId = null;

        function textToId(text) {
            let hash = 0;
            for (let i = 0; i < text.length; i++) {
                hash = (hash << 5) - hash + text.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash).toString(36);
        }

        function saveHistory(company, platform, content) {
            if (!content || content.includes("Ready to generate")) return;

            const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            const timestamp = new Date().toLocaleString();
            const id = textToId(company + platform + timestamp);

            // Avoid duplicates (simple check)
            if (history.length > 0 && history[0].content === content) return;

            const newItem = { id, company, platform, content, timestamp };
            history.unshift(newItem); // Add to top

            // Limit to 10 items
            if (history.length > 10) history.pop();

            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            renderHistory();
        }

        function loadHistoryItem(id) {
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            const item = history.find(h => h.id === id);
            if (item) {
                document.getElementById('output').innerHTML = item.content;
                document.getElementById('output').className = `platform-${item.platform.toLowerCase()}`;

                // Restore inputs
                document.getElementById('company').value = item.company;
                document.getElementById('platform').value = item.platform;

                // Clear sources container as we don't save those (simplification)
                document.getElementById('sources-container').innerHTML =
                    `<div style="color: var(--text-secondary); font-size: 0.9rem; font-style: italic; text-align: center;">(Source data not saved in history)</div>`;
            }
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');

            if (history.length === 0) {
                list.innerHTML = `<div style="font-size: 0.75rem; color: var(--text-secondary); text-align: center; font-style: italic;">No history yet.</div>`;
                return;
            }

            list.innerHTML = history.map(item => `
                <div class="history-item" onclick="loadHistoryItem('${item.id}')">
                    <span class="history-title">${item.company || 'Untitled'} (${item.platform})</span>
                    <span class="history-meta">${item.timestamp}</span>
                </div>
            `).join('');
        }

        // Initialize History on Load
        document.addEventListener('DOMContentLoaded', renderHistory);


        // --- Chat & Rework Logic ---
        let currentSelectionRange = null;

        document.addEventListener('selectionchange', () => {
            const selection = window.getSelection();
            const tooltip = document.getElementById('rework-tooltip');
            const outputDiv = document.getElementById('output');

            // Only show if selection is inside output div and not empty
            if (selection.rangeCount > 0 && !selection.isCollapsed && outputDiv.contains(selection.anchorNode)) {
                const range = selection.getRangeAt(0);
                const rect = range.getBoundingClientRect();

                currentSelectionRange = range;

                // Position tooltip
                tooltip.style.display = 'block';
                tooltip.style.top = `${rect.top + window.scrollY - 40}px`;
                tooltip.style.left = `${rect.left + window.scrollX}px`;
            } else {
                tooltip.style.display = 'none';
                // Don't clear currentSelectionRange immediately to allow button click
            }
        });

        function activateRework() {
            const input = document.getElementById('chat-input');
            input.focus();
            input.placeholder = "Tell Chaka how to rewrite the selected text...";
            input.style.borderColor = "var(--accent-blue)";
            input.style.boxShadow = "0 0 10px rgba(59, 130, 246, 0.5)";
        }

        function handleChatKey(e) {
            if (e.key === 'Enter') sendChat();
        }

        async function sendChat() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            const messagesDiv = document.getElementById('chat-messages');
            const outputDiv = document.getElementById('output');

            if (!message) return;

            // 1. Add User Message
            messagesDiv.innerHTML += `<div class="chat-msg chat-user">${message}</div>`;
            input.value = "";
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // 2. Prepare Payload
            const context = outputDiv.innerText;

            // Check if we are doing a rework (is there a selection?)
            let selectionText = "";
            if (window.getSelection().toString().length > 0) {
                selectionText = window.getSelection().toString();
                currentSelectionRange = window.getSelection().getRangeAt(0);
            } else if (currentSelectionRange && !currentSelectionRange.collapsed) {
                selectionText = currentSelectionRange.toString();
            }

            const payload = {
                message: message,
                context: context,
                selection: selectionText,
                model: document.getElementById('model').value
            };

            // 3. Add AI Placeholder
            const aiMsgId = `ai-msg-${Date.now()}`;
            messagesDiv.innerHTML += `<div id="${aiMsgId}" class="chat-msg chat-ai">Thinking...</div>`;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                const response = await fetch('http://localhost:8001/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let aiText = "";
                const aiMsgDiv = document.getElementById(aiMsgId);
                aiMsgDiv.innerHTML = ""; // Clear "Thinking..."

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);
                    aiText += chunk;
                    aiMsgDiv.innerHTML = marked.parse(aiText);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }

                // If REWORK mode, apply the change
                if (selectionText) {
                    aiMsgDiv.innerHTML += `<br><button onclick="applyRework('${aiMsgId}')" style="margin-top:5px; font-size:0.7rem; padding:4px 8px; background:var(--accent-blue); border:none; color:white; border-radius:4px; cursor:pointer;">✅ Apply Change</button>`;
                    aiMsgDiv.dataset.rawText = aiText;
                }

            } catch (error) {
                console.error("Chat Error:", error);
                document.getElementById(aiMsgId).innerHTML = "Error: Failed to connect to Chaka.";
            }

            input.placeholder = "Ask Chaka or select text to rework...";
            input.style = "";
        }

        function applyRework(msgId) {
            const aiMsgDiv = document.getElementById(msgId);
            const newText = aiMsgDiv.dataset.rawText;

            if (currentSelectionRange && newText) {
                currentSelectionRange.deleteContents();
                const newNode = document.createTextNode(newText);
                currentSelectionRange.insertNode(newNode);

                window.getSelection().removeAllRanges();
                currentSelectionRange = null;

                aiMsgDiv.innerHTML += ` (Applied)`;

                const company = document.getElementById('company').value;
                const platform = document.getElementById('platform').value;
                saveHistory(company, platform, document.getElementById('output').innerHTML);
            } else {
                alert("Selection lost. Please select the text again and ask to rework.");
            }
        }

        async function generateStrategy() {
            const outputDiv = document.getElementById("output");
            const sourcesContainer = document.getElementById("sources-container");
            const btn = document.querySelector('.btn-generate');
            const platform = document.getElementById('platform').value;

            // Check for empty/missing values to avoid null errors
            const daysVal = document.getElementById('days').value || "3";
            const lengthVal = document.getElementById('length') ? document.getElementById('length').value : "Medium";

            // UI Reset
            outputDiv.innerHTML = "<span class='typing-cursor'>Researching ecosystem (Tavily + Serper)...</span>";
            outputDiv.className = `platform-${platform.toLowerCase()}`; // Remove initial-state class
            sourcesContainer.innerHTML = ""; // Clear sources
            sourcesContainer.style = ""; // Reset inline centering style

            const existingBadge = document.getElementById('virality-badge');
            existingBadge.style.display = 'none';

            btn.disabled = true;
            btn.innerText = "Generating Strategy...";

            try {
                const response = await fetch("http://localhost:8001/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        company: document.getElementById("company").value,
                        focus: document.getElementById("focus").value,
                        days: daysVal,
                        model: document.getElementById("model").value,
                        length: lengthVal,
                        platform: platform
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";
                let hasClearedInit = false;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    fullText += chunk;

                    // 1. Check for Sources Block [SOURCES_START]...[SOURCES_END]
                    const sourceMatch = fullText.match(/\[SOURCES_START\](.*?)\[SOURCES_END\]/s);
                    if (sourceMatch) {
                        const sourceData = sourceMatch[1];
                        // Remove block from display text
                        fullText = fullText.replace(sourceMatch[0], '');

                        try {
                            const sources = JSON.parse(sourceData);
                            renderSources(sources);
                        } catch (e) { console.error("Source parse error", e); }
                    }

                    // 2. Check for Virality Score
                    const scoreMatch = fullText.match(/\[VIRALITY_SCORE: (\d+)\]/);
                    let displayText = fullText;

                    if (scoreMatch) {
                        const score = scoreMatch[1];
                        displayText = fullText.replace(scoreMatch[0], '');
                        renderScore(score);
                    }

                    // 3. Render Content
                    if (!hasClearedInit && displayText.trim().length > 0) {
                        outputDiv.innerHTML = "";
                        hasClearedInit = true;
                    }

                    // Using marked for markdown rendering
                    if (typeof marked !== 'undefined') {
                        outputDiv.innerHTML = marked.parse(displayText);
                    } else {
                        outputDiv.textContent = displayText;
                    }

                    outputDiv.scrollTop = outputDiv.scrollHeight;
                }
            } catch (err) {
                outputDiv.innerHTML += `\n<span style="color: #ef4444">Error: ${err.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Initialize Engine";
            }
        }

        function renderSources(sources) {
            const container = document.getElementById("sources-container");
            container.innerHTML = ""; // Clear placeholder

            if (sources.length === 0) {
                container.innerHTML = "<div style='color: #94a3b8'>No public sources found.</div>";
                return;
            }

            sources.forEach(s => {
                const card = document.createElement("a");
                card.className = "source-card";
                card.href = s.url;
                card.target = "_blank";

                // Extract domain
                let domain = "";
                try { domain = new URL(s.url).hostname.replace('www.', ''); } catch (e) { domain = 'web source'; }

                // Add source badge
                const sourceBadge = s.source ? `<span style="font-size:0.7em; background:#334155; padding:2px 6px; border-radius:4px; margin-left:8px;">${s.source.toUpperCase()}</span>` : "";

                card.innerHTML = `
                    <div class="source-title">${s.title}</div>
                    <div class="source-domain">🔗 ${domain} ${sourceBadge}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderScore(score) {
            const badge = document.getElementById('virality-badge');
            badge.innerHTML = `<span>Viral Score</span><strong>${score}</strong>`;

            badge.className = ""; // Reset
            if (parseInt(score) > 80) badge.classList.add('high-score');
            else if (parseInt(score) > 50) badge.classList.add('med-score');
            else badge.classList.add('low-score');

            badge.style.display = 'flex';
        }
        async function exportDatabase() {
            try {
                const btn = event.target;
                const originalText = btn.innerText;
                btn.innerText = "⏳ Exporting...";
                btn.disabled = true;

                const response = await fetch('http://localhost:8001/export-sql');
                if (!response.ok) throw new Error('Export failed');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `rcode_media_export_${new Date().toISOString().split('T')[0]}.sql`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);

                btn.innerText = "✅ Exported!";
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.disabled = false;
                }, 2000);
            } catch (err) {
                console.error(err);
                alert("Failed to export database: " + err.message);
                event.target.innerText = "❌ Error";
                event.target.disabled = false;
            }
        }
    </script>
